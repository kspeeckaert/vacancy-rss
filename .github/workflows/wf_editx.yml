name: Generate editx feed

on:
  workflow_call:
  workflow_dispatch:

jobs:
  generate-rss:
    runs-on: ubuntu-latest
    # Stop a stalled run instead of waiting for the 6-hour default
    timeout-minutes: 60

    env:
      CONFIG_FILE: config/editx.json
      OUTPUT_FILE: feeds/editx.xml

    steps:
      - uses: actions/checkout@v4
      # setup-uv publishes no major-version tag, so pin the release commit
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Install Python from .python-version and the exact versions from uv.lock.
      # --locked fails the job when uv.lock does not match pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Generate RSS feed
        run: |
          uv run python editx.py -v -d $OUTPUT_FILE $CONFIG_FILE

      # The orchestrator commits all feeds in one job. A manual run of
      # only this workflow uploads the feed and commits nothing.
      - name: Upload feed
        uses: actions/upload-artifact@v7
        with:
          name: feed-editx
          path: ${{ env.OUTPUT_FILE }}
          retention-days: 1
          if-no-files-found: error
