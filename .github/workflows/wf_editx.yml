name: Generate editx feed

on:
  workflow_call:
  workflow_dispatch:

jobs:
  generate-rss:
    runs-on: ubuntu-latest
    # Stop a stalled run instead of waiting for the 6-hour default
    timeout-minutes: 60

    env:
      CONFIG_FILE: config/editx.json
      OUTPUT_FILE: feeds/editx.xml

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate RSS feed
        run: |
          python editx.py -v -d $OUTPUT_FILE $CONFIG_FILE

      # The orchestrator commits all feeds in one job. A manual run of
      # only this workflow uploads the feed and commits nothing.
      - name: Upload feed
        uses: actions/upload-artifact@v7
        with:
          name: feed-editx
          path: ${{ env.OUTPUT_FILE }}
          retention-days: 1
          if-no-files-found: error
